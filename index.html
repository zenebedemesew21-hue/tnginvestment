<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNG - Trust New Generation</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.07);
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            filter: blur(90px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            position: relative;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area h1 {
            font-size: 28px;
            margin: 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 5px 0 0 0;
        }

        .tab-buttons {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: var(--dark);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 13px 16px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: var(--dark);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .action-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(15, 23, 42, 0.3);
            border-radius: 50%;
            border-top-color: var(--dark);
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 25px;
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: -100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-left: 5px solid var(--primary);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            color: white;
            font-size: 14px;
            max-width: 320px;
        }
        .toast.show {
            right: 20px;
        }
    </style>
</head>
<body>

    <div class="blob" style="top: 10%; right: 10%;"></div>
    <div class="blob" style="bottom: 10%; left: 10%;"></div>

    <div id="toast" class="toast">መልዕክት</div>

    <div class="container">
        <div class="logo-area">
            <h1>Trust New Generation</h1>
            <p>የወደፊቱ የዲጂታል ኢንቨስተመንት መድረክ</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">መግቢያ (Login)</button>
            <button class="tab-btn" onclick="switchTab('register')">ምዝገባ (Register)</button>
        </div>

        <div id="login-form" class="auth-form active">
            <form id="l-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>የስልክ ቁጥር</label>
                    <input type="text" id="login-phone" placeholder="ምሳሌ: 0912345678" required>
                </div>
                <div class="input-group">
                    <label>የይለፍ ቃል (Password)</label>
                    <input type="password" id="login-pass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="action-btn" id="login-btn">
                    <span class="spinner" id="login-spinner"></span>
                    <span class="btn-text">አሁን ግባ (Login)</span>
                </button>
            </form>
        </div>

        <div id="register-form" class="auth-form">
            <form id="r-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>የስልክ ቁጥር</label>
                    <input type="text" id="reg-phone" placeholder="ምሳሌ: 0912345678" required>
                </div>
                <div class="input-group">
                    <label>የይለፍ ቃል (Password)</label>
                    <input type="password" id="reg-pass" placeholder="бияንስ 8 ሆሄያት እና ቁጥር" required>
                </div>
                <button type="submit" class="action-btn" id="reg-btn">
                    <span class="spinner" id="reg-spinner"></span>
                    <span class="btn-text">አካውንት ክፈት (Register)</span>
                </button>
            </form>
        </div>

        <div class="footer-note">
            የምዝገባ ቦነስ 200.00 ETB በራስ-ሰር ይሰጥዎታል።<br>
            © 2026 Trust New Generation (TNG). All rights reserved.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 🔒 እዚህ ጋር አዲሱ የ Supabase ፕሮጀክት ሊንክ እና አፕሊኬሽን ኬይ ብቻ ተቀይሯል
        const SUPABASE_URL = 'https://jkxkstmtjrszqdsobdfr.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpreGtzdG10anJzenFkc29iZGZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MTg1NjAsImV4cCI6MjA5NDk5NDU2MH0.weNY8wtxWRA1e1dCFWyIk8O1oMU47SURJNoTV53lIeI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.borderLeftColor = type === 'success' ? 'var(--success)' : 'var(--error)';
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function validatePhone(phone) {
            const phoneRegex = /^(09|07)\d{8}$/;
            return phoneRegex.test(phone);
        }

        function validatePassword(password) {
            const passRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d\W_]{8,}$/;
            return passRegex.test(password);
        }

        async function hashPassword(string) {
            const utf8 = new TextEncoder().encode(string);
            const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function switchTab(type) {
            const tabs = document.querySelectorAll('.tab-btn');
            const forms = document.querySelectorAll('.auth-form');
            
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));

            if(type === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        function setSubmitting(btnId, spinnerId, isSubmitting) {
            const btn = document.getElementById(btnId);
            const spinner = document.getElementById(spinnerId);
            btn.disabled = isSubmitting;
            spinner.style.display = isSubmitting ? 'inline-block' : 'none';
        }

        async function handleRegister(event) {
            if(event) event.preventDefault();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-pass').value;

            if(!validatePhone(phone)) {
                showToast("እባክዎ ትክክለኛ የኢትዮጵያ ስልክ ቁጥር ያስገቡ! (ምሳሌ፡ 0912345678)", "error");
                return;
            }
            if(!validatePassword(password)) {
                showToast("የይለፍ ቃል ቢያንስ 8 ፊደላት ሆኖ ቁጥርና ሆሄ ማካተት አለበት!", "error");
                return;
            }

            setSubmitting('reg-btn', 'reg-spinner', true);

            try {
                const { data: userExist } = await _supabase.from('users').select('phone_number').eq('phone_number', phone).maybeSingle();
                if(userExist) { 
                    showToast("ይህ ስልክ ቁጥር ቀድሞ ተመዝግቧል!", "error");
                    setSubmitting('reg-btn', 'reg-spinner', false);
                    return; 
                }

                const securePassword = await hashPassword(password);

                const { error } = await _supabase.from('users').insert([{
                    phone_number: phone,
                    password: securePassword,
                    balance: 200.00,
                    vip_level: 'VIP 0'
                }]);

                if (error) { 
                    showToast("ስህተት: " + error.message, "error"); 
                } else {
                    showToast("🎉 በተሳካ ሁኔታ ተመዝግበዋል! የ 200 ብር ቦነስ አግኝተዋል።");
                    localStorage.setItem('user_phone', phone);
                    setTimeout(goToDashboard, 2000);
                }
            } catch (err) { 
                showToast("የግንኙነት ስህተት አጋጥሟል!", "error"); 
            } finally {
                setSubmitting('reg-btn', 'reg-spinner', false);
            }
        }

        async function handleLogin(event) {
            if(event) event.preventDefault();
            const phone = document.getElementById('login-phone').value.trim();
            const password = document.getElementById('login-pass').value;

            if(!validatePhone(phone)) {
                showToast("እባክዎ ትክክለኛ ስልክ ቁጥር ያስገቡ!", "error");
                return;
            }

            setSubmitting('login-btn', 'login-spinner', true);

            try {
                const hashedInputPassword = await hashPassword(password);

                const { data, error } = await _supabase
                    .from('users')
                    .select('*')
                    .eq('phone_number', phone)
                    .eq('password', hashedInputPassword)
                    .maybeSingle();

                if (error || !data) { 
                    showToast("የስልክ ቁጥር ወይም የይለፍ ቃል ስህተት ነው!", "error"); 
                } else {
                    showToast("እንኳን ደህና መጡ! በተሳካ ሁኔታ ገብተዋል!");
                    localStorage.setItem('user_phone', phone);
                    setTimeout(goToDashboard, 2000);
                }
            } catch (err) { 
                showToast("የማረጋገጫ ስህተት አጋጥሟል!", "error"); 
            } finally {
                setSubmitting('login-btn', 'login-spinner', false);
            }
        }

        function goToDashboard() {
            window.location.href = "memberdashbord.html";
        }
    </script>
</body>
</html>
